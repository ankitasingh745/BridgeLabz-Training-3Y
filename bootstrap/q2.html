<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aisha Verma – Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">
  <!-- header: p-5 = large padding, text-center, bg-white -->
  <header class="bg-white p-5 text-center border-bottom">
    <h1 class="fw-bold">Aisha Verma</h1>
    <p class="text-muted mb-0">Front-End Developer &amp; UI Designer</p>
  </header>

  <main class="container text-center">
    <!-- mt-4: margin-top; img-fluid = responsive image; rounded-circle = round crop -->
    <img src="https://picsum.photos/id/64/300/300" alt="Profile photo" class="img-fluid rounded-circle mt-4 mb-3 profile-img">
    <p class="mx-auto about">Hi! I build clean, accessible websites. I love turning ideas into fast, responsive interfaces.</p>

    <div class="mb-4">
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-dark">Download CV</a>
    </div>

    <!-- Contact form: form-control styles inputs; col-md-6 + justify-content-center centers it -->
    <section id="contact" class="row justify-content-center mb-5">
      <div class="col-md-6 bg-white p-4 rounded shadow-sm text-start">
        <h2 class="h4 fw-bold text-center mb-3">Contact Me</h2>
        <form>
          <input type="text" class="form-control mb-3" placeholder="Your name">
          <input type="email" class="form-control mb-3" placeholder="Your email">
          <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
          <button type="submit" class="btn btn-dark w-100">Send</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4"><small>&copy; 2026 Aisha Verma</small></footer>
</body>
</html>
