<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q6.css">
</head>
<body class="bg-light">
  <header class="bg-primary text-white text-center py-3"><h1 class="h3 mb-0">Dashboard · Notifications</h1></header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Summary well: bordered, padded, light background -->
        <div class="bg-light border rounded p-3 mb-4 well">
          <strong>Summary:</strong> 4 new notifications today – 1 message, 1 tip, 1 warning, 1 update.
        </div>

        <!-- card groups the alerts -->
        <div class="card shadow-sm">
          <div class="card-header fw-bold">Recent Activity</div>
          <div class="card-body">
            <div class="alert alert-success" role="alert"><strong>New message!</strong> Riya replied to your project comment.</div>
            <div class="alert alert-info" role="alert"><strong>Tip:</strong> Press "/" anywhere to open quick search.</div>
            <div class="alert alert-danger" role="alert"><strong>Warning:</strong> Your storage is 95% full.</div>
            <!-- alert-dismissible + btn-close = closable alert (needs Bootstrap JS) -->
            <div class="alert alert-warning alert-dismissible fade show mb-0" role="alert">
              <strong>Update:</strong> Scheduled maintenance tonight at 11 PM.
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
