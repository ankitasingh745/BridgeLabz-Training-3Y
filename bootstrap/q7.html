<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q7.css">
</head>
<body class="bg-light">
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">Task Tracker</h1>
      <!-- Badge counter: total pending tasks -->
      <span class="fs-6">Pending <span class="badge bg-danger rounded-pill">4</span></span>
    </div>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-8">
      <ul class="list-group shadow-sm mb-4">
        <!-- Priority badges: danger = High, warning = Medium, success = Low -->
        <li class="list-group-item d-flex justify-content-between align-items-center">Fix login bug <span class="badge bg-danger">High</span></li>
        <li class="list-group-item d-flex justify-content-between align-items-center">Prepare sprint report <span class="badge bg-warning text-dark">Medium</span></li>
        <li class="list-group-item d-flex justify-content-between align-items-center">Update team wiki <span class="badge bg-success">Low</span></li>
        <li class="list-group-item d-flex justify-content-between align-items-center">Review pull requests <span class="badge bg-warning text-dark">Medium</span></li>
      </ul>

      <!-- Button with embedded badge -->
      <button type="button" class="btn btn-outline-primary">Completed <span class="badge bg-primary">12</span></button>
    </div></div>
  </main>
</body>
</html>
