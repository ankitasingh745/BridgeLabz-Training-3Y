<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Transformations Showcase</h1>
    <p>Hover over each box to see its transformation.</p>
  </header>

  <main>
    <!-- Four boxes arranged horizontally with Flexbox -->
    <section class="transform-row">

      <div class="transform-item">
        <div class="transform-box rotate-box"></div>
        <p>rotate(45deg)</p>
      </div>

      <div class="transform-item">
        <div class="transform-box scale-box"></div>
        <p>scale(1.3)</p>
      </div>

      <div class="transform-item">
        <div class="transform-box translate-box"></div>
        <p>translate(20px, -15px)</p>
      </div>

      <div class="transform-item">
        <div class="transform-box skew-box"></div>
        <p>skew(15deg, 5deg)</p>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 7 &mdash; Question 6</p>
  </footer>
</body>
</html>
