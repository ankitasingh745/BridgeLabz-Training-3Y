<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding</h1>
    <p>Hover over any box to see its border color transition.</p>
  </header>

  <main>
    <!-- Boxes aligned horizontally with Flexbox -->
    <section class="box-row">

      <div class="demo-box solid-border">
        <h2>Solid</h2>
        <p>border-style: solid; padding: 10px;</p>
      </div>

      <div class="demo-box dashed-border">
        <h2>Dashed</h2>
        <p>border-style: dashed; padding: 20px;</p>
      </div>

      <div class="demo-box double-border">
        <h2>Double</h2>
        <p>border-style: double; padding: 15px;</p>
      </div>

      <div class="demo-box groove-border">
        <h2>Groove</h2>
        <p>border-style: groove; padding: 25px, rounded corners</p>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 7 &mdash; Question 1</p>
  </footer>
</body>
</html>
