<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>

  <main>
    <form class="contact-form">

      <label for="name">Name</label>
      <input type="text" id="name" class="field-solid" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" class="field-dashed" placeholder="you@example.com">

      <label for="subject">Subject</label>
      <input type="text" id="subject" class="field-dotted" placeholder="Subject">

      <label for="message">Message</label>
      <textarea id="message" class="field-solid-offset" rows="4" placeholder="Your message"></textarea>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </main>

  <footer>
    <p>Assignment 7 &mdash; Question 9</p>
  </footer>
</body>
</html>
