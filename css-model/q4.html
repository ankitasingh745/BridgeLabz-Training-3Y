<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shadows &amp; Depth</h1>
    <p>Hover over a card to see it lift.</p>
  </header>

  <main>
    <section class="card-row">

      <article class="depth-card shadow-soft">
        <h2>Soft Shadow</h2>
        <p>A subtle, diffuse shadow for a gentle sense of elevation.</p>
      </article>

      <article class="depth-card shadow-sharp">
        <h2>Sharp Shadow</h2>
        <p>A tighter, darker shadow that reads as closer to the page.</p>
      </article>

      <article class="depth-card shadow-colored">
        <h2>Colored Shadow</h2>
        <p>A tinted shadow that matches the card's accent color.</p>
      </article>

    </section>
  </main>

  <footer>
    <p>Assignment 7 &mdash; Question 4</p>
  </footer>
</body>
</html>
