<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    .field { margin-bottom: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    input.invalid { border: 2px solid red; }
    .error { color: red; font-size: 13px; min-height: 16px; display: block; }
    button { padding: 8px 18px; cursor: pointer; }
    #successMessage { margin-top: 14px; padding: 10px; background: #e6f4ea; color: #1b5e20; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Register</h2>
  <!-- novalidate turns off the browser's own popups so our JS messages are shown -->
  <form id="registerForm" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <span class="error" id="nameError"></span>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" name="email">
      <span class="error" id="emailError"></span>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
      <span class="error" id="passwordError"></span>
    </div>
    <button type="submit">Submit</button>
  </form>
  <div id="successMessage" hidden>Form Submitted Successfully</div>
  <script src="q9.js"></script>
</body>
</html>
