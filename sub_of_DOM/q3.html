<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    .step { display: none; }
    .step.active { display: block; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin: 6px 0; }
    #errorMessage { color: red; min-height: 20px; font-size: 14px; }
    .buttons { display: flex; justify-content: space-between; margin-top: 10px; }
    button { padding: 6px 16px; cursor: pointer; }
    #summary { border: 1px solid #4caf50; padding: 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Sign Up</h2>
  <div id="wizard">
    <p id="stepIndicator">Step 1 of 3</p>

    <div class="step active">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="Your name">
    </div>
    <div class="step">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="step">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="At least 6 characters">
    </div>

    <div id="errorMessage"></div>
    <div class="buttons">
      <button id="backButton">Back</button>
      <button id="nextButton">Next</button>
    </div>
  </div>

  <div id="summary" hidden></div>
  <script src="q3.js"></script>
</body>
</html>
