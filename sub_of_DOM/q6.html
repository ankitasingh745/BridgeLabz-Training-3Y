<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q6 - Table Filter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; }
    #searchBox { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    #noResultsRow td { text-align: center; color: #b00020; }
  </style>
</head>
<body>
  <h2>Student Records</h2>
  <input type="text" id="searchBox" placeholder="Search by name, branch or CGPA...">
  <table>
    <thead>
      <tr><th>Name</th><th>Branch</th><th>CGPA</th></tr>
    </thead>
    <tbody id="tableBody">
      <tr class="student-row"><td>Aman Sharma</td><td>CSE</td><td>8.9</td></tr>
      <tr class="student-row"><td>Riya Verma</td><td>ECE</td><td>8.2</td></tr>
      <tr class="student-row"><td>Karan Singh</td><td>Mechanical</td><td>7.5</td></tr>
      <tr class="student-row"><td>Simran Kaur</td><td>CSE</td><td>9.1</td></tr>
      <tr class="student-row"><td>Vikas Gupta</td><td>Civil</td><td>7.8</td></tr>
      <tr id="noResultsRow" hidden><td colspan="3">No results found</td></tr>
    </tbody>
  </table>
  <script src="q6.js"></script>
</body>
</html>
