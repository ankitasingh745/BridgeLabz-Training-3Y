<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
    textarea { width: 100%; height: 120px; padding: 8px; box-sizing: border-box; }
    #counter { margin: 8px 0 12px; font-weight: bold; color: green; }
    #counter.warning { color: #d4a000; }   /* yellow: 20 or fewer left */
    #counter.danger  { color: red; }       /* red: limit reached */
    button { padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="messageBox" placeholder="Type your message here..."></textarea>
  <div id="counter">100 characters left</div>
  <button id="resetButton">Reset</button>
  <script src="q2.js"></script>
</body>
</html>
