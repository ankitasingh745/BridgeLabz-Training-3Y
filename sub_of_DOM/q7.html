<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 - Mouse Logger</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    #box { position: relative; width: 400px; height: 400px; border: 2px solid #333;
           background: #f7f7f7; overflow: hidden; cursor: crosshair; }
    .dot { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%;
           transform: translate(-50%, -50%); pointer-events: none; } /* centre the dot on the click point */
    #coordinates { margin-top: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h2>Mouse Coordinates Logger</h2>
  <p>Move the mouse inside the box. Double-click to drop a red dot.</p>
  <div id="box"></div>
  <div id="coordinates">Move the mouse inside the box...</div>
  <script src="q7.js"></script>
</body>
</html>
