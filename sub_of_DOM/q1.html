<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Product List Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-row input { flex: 1; padding: 8px; }
    button { padding: 6px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    .product-item { display: flex; justify-content: space-between; align-items: center;
                    padding: 8px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .edit-input { flex: 1; margin-right: 8px; padding: 4px; }
    .actions { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <h2>Product List Manager</h2>
  <div class="add-row">
    <input type="text" id="productInput" placeholder="Enter product name">
    <button id="addButton">Add</button>
  </div>
  <ul id="productList"></ul>
  <script src="q1.js"></script>
</body>
</html>
