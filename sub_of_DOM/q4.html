<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 - Theme Switcher</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 60px; transition: 0.3s; }
    button { padding: 8px 18px; margin: 4px; cursor: pointer; }

    /* One class per theme, applied to <body> through setAttribute() */
    body.theme-light { background: #ffffff; color: #222222; }
    body.theme-dark  { background: #1e1e1e; color: #f1f1f1; }
    body.theme-blue  { background: #d6ebff; color: #0b3d91; }
  </style>
</head>
<body>
  <h2>Theme Switcher</h2>
  <p>Current theme: <strong id="currentTheme"></strong></p>
  <div id="themeButtons">
    <button data-theme-name="light">Light</button>
    <button data-theme-name="dark">Dark</button>
    <button data-theme-name="blue">Blue</button>
  </div>
  <script src="q4.js"></script>
</body>
</html>
