<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gallery Showcase</h1>
    <p>Hover over an image to see it scale and darken.</p>
  </header>

  <main>
    <!-- Six images arranged with CSS Grid -->
    <section class="gallery">

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-1"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Mountain Trail</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-2"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>City Lights</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-3"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Desert Dunes</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-4"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Ocean Waves</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-5"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Path</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="gallery-frame">
          <div class="gallery-image img-6"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Northern Sky</figcaption>
      </figure>

    </section>
  </main>

 
</body>
</html>
