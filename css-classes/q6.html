<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Animations</h1>
    <p>Three elements animating continuously using @keyframes.</p>
  </header>

  <main>
    <section class="animation-stage">

      <div class="anim-item">
        <div class="moving-box"></div>
        <p>Moving box</p>
      </div>

      <div class="anim-item">
        <div class="bouncing-ball"></div>
        <p>Bouncing ball</p>
      </div>

      <div class="anim-item">
        <p class="color-text">Color-changing text</p>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 6</p>
  </footer>
</body>
</html>
