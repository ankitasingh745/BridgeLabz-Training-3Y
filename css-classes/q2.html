<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-Only Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tooltips Built with Pure CSS</h1>
    <p>Hover over any item below to reveal its tooltip.</p>
  </header>

  <main>
    <!-- All tooltip examples centered with Flexbox -->
    <section class="tooltip-row">

      <span class="tooltip-wrapper" tabindex="0">
        <span class="icon">&#9733;</span>
        <span class="tooltip-text">Favorite</span>
      </span>

      <span class="tooltip-wrapper" tabindex="0">
        <span class="icon">&#128231;</span>
        <span class="tooltip-text">Send a message</span>
      </span>

      <span class="tooltip-wrapper" tabindex="0">
        <span class="icon">&#9881;</span>
        <span class="tooltip-text">Settings</span>
      </span>

      <span class="tooltip-wrapper" tabindex="0">
        <span class="word">Hover this word</span>
        <span class="tooltip-text">Tooltips also work on plain text</span>
      </span>

      <span class="tooltip-wrapper" tabindex="0">
        <span class="icon">&#10004;</span>
        <span class="tooltip-text">Mark as done</span>
      </span>

    </section>
  </main>

</body>
</html>
