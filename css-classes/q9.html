<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Effects Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Combined Effects</h1>
    <p>Every card below mixes a pseudo-class, a transition, and a transform.</p>
  </header>

  <main>
    <!-- Examples spread evenly across the page with Flexbox -->
    <section class="effects-row">

      <button class="fx-card">
        <span class="fx-icon">&#9733;</span>
        <span>Grow &amp; Glow</span>
      </button>

      <button class="fx-card">
        <span class="fx-icon">&#8635;</span>
        <span>Spin &amp; Shift</span>
      </button>

      <button class="fx-card">
        <span class="fx-icon">&#9650;</span>
        <span>Lift &amp; Lighten</span>
      </button>

      <button class="fx-card">
        <span class="fx-icon">&#9679;</span>
        <span>Pulse &amp; Deepen</span>
      </button>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 9</p>
  </footer>
</body>
</html>
